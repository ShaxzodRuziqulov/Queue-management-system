version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qms_db
    restart: always
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - qms_network

  app:
    build: .
    container_name: qms_app
    restart: always
    ports:
      - "80:9092"  # E'tibor bering: Serverning 80 porti (HTTP) ichkaridagi 9092 portga ulanmoqda
    environment:
      - DB_URL=jdbc:postgresql://db:5432/qms
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - qms_network

networks:
  qms_network:
    driver: bridge

volumes:
  pgdata:
